# Railway deployment configuration for apsaratalent-api
# Each service is deployed separately in Railway.
# When creating a service in Railway, set the "Root Directory" and "Dockerfile Path" accordingly.
#
# Service         | Root Directory          | Dockerfile Path
# ----------------|-------------------------|----------------------------------------------
# api-gateway     | apsaratalent-api        | apps/api-gateway/Dockerfile
# auth-service    | apsaratalent-api        | apps/auth-service/Dockerfile
# user-service    | apsaratalent-api        | apps/user-service/Dockerfile
# resume-service  | apsaratalent-api        | apps/resume-builder-service/Dockerfile
# chat-service    | apsaratalent-api        | apps/chat-service/Dockerfile
# job-service     | apsaratalent-api        | apps/job-service/Dockerfile
# notification    | apsaratalent-api        | apps/notification-service/Dockerfile
#
# All services share the same environment variables (set in Railway project settings).
# Internal services communicate via Railway's private networking using service hostnames.
# Only api-gateway needs a public domain exposed.
#
# IMPORTANT - api-gateway storage:
# The api-gateway serves uploaded chat files from /app/storage.
# In Railway, add a Volume to the api-gateway service mounted at /app/storage
# so uploaded files persist across deploys and restarts.

[build]
builder = "DOCKERFILE"
# IMPORTANT:
# Do not set a single shared `dockerfilePath` in this root file for a
# multi-service Railway project. If set here, every service may build the same
# Dockerfile (for example api-gateway), which causes internal TCP services to
# be unreachable (ECONNREFUSED on 3001/3002/...).
#
# Instead, configure Dockerfile Path per Railway service in the UI:
# - api-gateway     -> apps/api-gateway/Dockerfile
# - auth-service    -> apps/auth-service/Dockerfile
# - user-service    -> apps/user-service/Dockerfile
# - resume-service  -> apps/resume-builder-service/Dockerfile
# - chat-service    -> apps/chat-service/Dockerfile
# - job-service     -> apps/job-service/Dockerfile
# - notification    -> apps/notification-service/Dockerfile
#
# Also configure a service-specific config file path so Railway probes the
# correct endpoint:
# - API services      -> railway/api-service.toml
# - Prometheus        -> railway/prometheus.toml
# - Alertmanager      -> railway/alertmanager.toml
# - blackbox-exporter -> railway/blackbox-exporter.toml
# - Grafana           -> railway/grafana.toml

# NOTE: Railway does not read this section. `railwayConfigFile` is unset on
# every service, and seven services now deploy from a GHCR image where there is
# no repository to read a config file from at all. Until 2026-08-09 that meant
# overlapSeconds and drainingSeconds had never applied to anything — deploys
# replaced an instance before it was serving and cut in-flight requests.
#
# They are now set directly on each service instead, and asserted by
# scripts/ci/check-infra-drift.mjs so they cannot silently revert. This block is
# kept as the documented intent; the drift check is what enforces it.
[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 20
drainingSeconds = 30
