name: Verify and deploy API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  # A production migration/release must never be interrupted or interleaved.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Reject committed environment files
        shell: bash
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env' | grep -vE '(^|/)\.env(\.[A-Za-z0-9_-]+)*\.example$|(^|/)\.env\.test$|test/e2e/e2e\.env$' || true)
          if [[ -n "$tracked" ]]; then
            echo "::error::Environment files must never be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Reject credential-shaped literals
        shell: bash
        run: |
          if git grep -nIE \
            -e 'sk-[A-Za-z0-9]{20,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'SG\.[A-Za-z0-9_-]{20,}' \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e "(SECRET|PASSWORD|TOKEN|API_KEY)[A-Z_]*[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9/+_-]{24,}" \
            -e "(postgres(ql)?|mysql|mongodb(\\+srv)?|redis|rediss|amqps?)://[^[:space:]\"']+:[^[:space:]\"']+@" \
            -e '(hc-ping\.com|nosnch\.in|cronitor\.link|betterstack\.com/api/v[0-9]+/heartbeat)/[A-Za-z0-9/_-]{8,}' \
            -- 'apps/**' 'libs/**' 'scripts/**' 'migrations/**' 'test/**' '*.ts' '*.js' '*.mjs' '*.json' '*.yml' '*.toml' '*.md' \
            ':!*.spec.ts' ':!package-lock.json' ':!test/e2e/e2e.env'; then
            echo "::error::Possible hard-coded credential above. Move it to an environment variable."
            exit 1
          fi

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Capture complete production dependency audit
        run: npm audit --omit=dev --json > dependency-audit.json || true

      - name: Reject high or critical production advisories
        run: npm run security:audit

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Lint and environment contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the copyable environment example
        run: npm run check:env -- .env.example

      - name: Run lint
        run: npm run lint:check

  test:
    name: Unit and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [secrets, dependencies, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm run test:cov -- --runInBand

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Run isolated end-to-end tests
        run: npm run test:e2e

  build:
    name: Typecheck and build every service
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [secrets, dependencies, lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all services
        run: npx tsc --noEmit -p tsconfig.json

      - name: Enforce strict-null ratchet
        run: npm run typecheck:strict

      - name: Validate load-test configuration
        run: npm run test:load:check

      - name: Build every service
        run: npm run build:all

  containers:
    name: Container ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [secrets, dependencies, lint, test, build]
    permissions:
      contents: read
      # Required to publish scan results to the repository's Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - resume-builder-service
          - chat-service
          - job-service
          - notification-service
    steps:
      - uses: actions/checkout@v7

      - name: Build production container
        run: >-
          docker build
          --file apps/${{ matrix.service }}/Dockerfile
          --tag apsaratalent/${{ matrix.service }}:${{ github.sha }}
          .

      # The image is scanned, not merely built. `npm audit` sees the JavaScript
      # dependency tree only — nothing before this step looks at the Alpine base
      # layer or at what actually lands in the shipped filesystem. Dependabot's
      # docker ecosystem bumps the base image TAG; it cannot tell you the image
      # you are about to ship has a known CVE.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: apsaratalent/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: container-${{ matrix.service }}

      # Reported above, enforced here — and deliberately narrower than the
      # report. An unfixable advisory must never block a release, because there
      # is nothing anyone can do about it; a CRITICAL that HAS a fix is one base
      # image bump away and should stop the line.
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: apsaratalent/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
          # Exceptions apply to the GATE only — the SARIF report above is
          # unfiltered. See .trivy-gate-ignore for why an entry is allowed.
          trivyignores: .trivy-gate-ignore

  monitoring:
    name: Validate monitoring configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secrets, dependencies, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Validate Grafana dashboard JSON
        run: jq empty monitoring/grafana/dashboards/apsaratalent-api.json

      - name: Validate Prometheus configurations and alert rules
        shell: bash
        run: |
          metrics_token_file="$RUNNER_TEMP/prometheus-metrics-token"
          touch "$metrics_token_file"
          chmod 600 "$metrics_token_file"
          docker run --rm \
            -v "$PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.13.2 check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/monitoring/production/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            -v "$metrics_token_file:/tmp/apsara-metrics-token:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.13.2 check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager configurations
        shell: bash
        run: |
          watchdog_url_file="$RUNNER_TEMP/alertmanager-watchdog-url"
          printf 'https://example.invalid/heartbeat' > "$watchdog_url_file"
          chmod 600 "$watchdog_url_file"

          docker run --rm \
            -v "$PWD/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.33.1 check-config /etc/alertmanager/alertmanager.yml

          # With the dead-man's switch enabled.
          docker run --rm \
            -v "$PWD/monitoring/production/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$watchdog_url_file:/tmp/apsara-watchdog-url:ro" \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.33.1 check-config /etc/alertmanager/alertmanager.yml

          # And the variant entrypoint.sh produces when WATCHDOG_HEARTBEAT_URL
          # is unset. This is the whole reason the markers exist: if the strip
          # ever leaves invalid YAML, Alertmanager fails to start and the stack
          # is deaf — so the stripped form is validated here, not discovered in
          # production. Kept byte-identical to the entrypoint's sed expression.
          stripped="$RUNNER_TEMP/alertmanager-no-watchdog.yml"
          sed '/# WATCHDOG-WEBHOOK-BEGIN/,/# WATCHDOG-WEBHOOK-END/d' \
            monitoring/production/alertmanager/alertmanager.yml > "$stripped"
          if grep -q 'webhook_configs' "$stripped"; then
            echo "::error::Stripping the watchdog block left a webhook behind."
            exit 1
          fi
          docker run --rm \
            -v "$stripped:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.33.1 check-config /etc/alertmanager/alertmanager.yml

      - name: Validate blackbox exporter configuration
        run: >-
          docker run --rm
          -v "$PWD/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro"
          prom/blackbox-exporter:v0.28.0
          --config.file=/etc/blackbox/blackbox.yml
          --config.check

  monitoring-containers:
    name: Monitoring container ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [secrets, dependencies, lint, monitoring]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [prometheus, alertmanager, blackbox, grafana]
    steps:
      - uses: actions/checkout@v7

      - name: Build production monitoring container
        run: >-
          docker build
          --file monitoring/production/${{ matrix.service }}/Dockerfile
          --tag apsaratalent/monitoring-${{ matrix.service }}:${{ github.sha }}
          .

      # These four are upstream images with a config layer on top, so their CVEs
      # arrive entirely through base image bumps — exactly the class npm audit
      # cannot see.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: apsaratalent/monitoring-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-monitoring-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-monitoring-${{ matrix.service }}.sarif
          category: monitoring-${{ matrix.service }}

      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: apsaratalent/monitoring-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
          trivyignores: .trivy-gate-ignore

  release-preflight:
    name: Validate production release destination
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secrets, dependencies, lint, test, build, containers, monitoring, monitoring-containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      # NEON_* is in this list because the restore point is a release
      # requirement, not a nice-to-have: failing here costs a red build, while
      # failing after `migration:run` costs a recovery.
      - name: Require every release credential before migrations
        shell: bash
        run: |
          for name in DATABASE_URL RAILWAY_TOKEN NEON_API_KEY NEON_PROJECT_ID PRODUCTION_API_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required before a production migration can run."
              exit 1
            fi
          done

  migrate:
    name: Run production database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [release-preflight]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::DATABASE_URL is required. Complete the documented baseline before the first run."
            exit 1
          fi

      - name: Show migration status
        run: npm run migration:show
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # The restore point must exist before the first DDL statement runs. This
      # step failing is a hard stop by design — see docs/RUNBOOK.md §2.
      - name: Create pre-migration restore point
        id: restore-point
        run: npm run db:restore-point
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          RESTORE_POINT_LABEL: ${{ github.sha }}

      - name: Apply pending migrations
        run: npm run migration:run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Report the restore point covering this release
        if: always() && steps.restore-point.outputs.branch-name != ''
        shell: bash
        run: |
          echo "### Database restore point" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Taken immediately before migrations for \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ steps.restore-point.outputs.branch-name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Id: \`${{ steps.restore-point.outputs.branch-id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery procedure: docs/RUNBOOK.md §3." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy all Railway services
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release-preflight, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Require deployment configuration
        shell: bash
        run: |
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "::error::RAILWAY_TOKEN is required for production deployment."
            exit 1
          fi
          if [[ -z "$PRODUCTION_API_URL" ]]; then
            echo "::error::Set the PRODUCTION_API_URL repository variable to the public gateway origin."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.30.4

      # `railway up` does not populate RAILWAY_GIT_COMMIT_SHA — Railway only
      # injects it for its own git-triggered builds. Without this step every
      # image shipped with an empty release: Sentry events carried no release,
      # the source maps uploaded during the container build could not be matched
      # to them, and /health/live reported "unknown". That last one is why the
      # verification below could not tell a new revision from the previous one
      # still serving.
      #
      # --skip-deploys is load-bearing: setting a variable normally triggers its
      # own rollout, which would deploy all seven services at once and take the
      # gateway down. With it, the value lands on the service and the ordered
      # `railway up` steps below pick it up.
      - name: Stamp the release onto every application service
        env:
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for service in \
            "Auth Service" \
            "User Service" \
            "Resume Builder Service" \
            "Chat Service" \
            "Job Service" \
            "Notification Service" \
            "API Gateway"; do
            echo "Stamping $service with $RELEASE_SHA"
            railway variables \
              --service "$service" \
              --set "SENTRY_RELEASE=$RELEASE_SHA" \
              --skip-deploys
          done

      # Internal services go first; the public gateway switches last. Attached
      # mode streams the complete Railway build/deploy result and fails CI when
      # a service does not become active. These are the service names shown in
      # Railway Architecture; GitHub prefixes deployment labels separately.
      - name: Deploy auth service
        run: railway up --service "Auth Service"

      - name: Deploy user service
        run: railway up --service "User Service"

      - name: Deploy resume builder service
        run: railway up --service "Resume Builder Service"

      - name: Deploy chat service
        run: railway up --service "Chat Service"

      - name: Deploy job service
        run: railway up --service "Job Service"

      - name: Deploy notification service
        run: railway up --service "Notification Service"

      - name: Deploy Alertmanager
        run: railway up --service alertmanager

      - name: Deploy blackbox exporter
        run: railway up --service blackbox-exporter

      - name: Deploy Prometheus
        run: railway up --service prometheus

      - name: Deploy Grafana
        run: railway up --service grafana

      - name: Deploy API gateway
        run: railway up --service "API Gateway"

      # EXPECTED_RELEASE makes this prove the NEW revision is serving. Without
      # it, a `railway up` that silently changed nothing left the previous
      # revision answering health checks and the release passed verification.
      - name: Verify production liveness and every readiness dependency
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: node scripts/ci/verify-deployment.mjs "$PRODUCTION_API_URL"

      # Railway rollback is deliberately not automated here. Rolling back one
      # service while six others stay on the new revision is its own outage
      # (see docs/RUNBOOK.md §4), so the decision stays with a human — but the
      # human should not have to go find the procedure mid-incident.
      - name: Surface the rollback procedure
        if: failure()
        shell: bash
        run: |
          {
            echo "### ❌ Production verification failed — the new revision is live and unhealthy"
            echo ""
            echo "Roll back **all** API services together, or none. Mixed revisions"
            echo "talking over TCP RPC is a second outage."
            echo ""
            echo "1. Run the **Roll back Railway services** workflow with"
            echo "   \`service: all\` — it targets the deployment before this one."
            echo "2. If a migration in this release is not backward compatible,"
            echo "   read docs/RUNBOOK.md §5 *before* reverting it."
            echo "3. Restore point for this release is recorded in the \`migrate\` job summary."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Production verification failed. Roll back via the 'Roll back Railway services' workflow (service: all)."
