name: Staging load test

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Authorized staging API origin
        required: true
        type: string
      paths:
        description: Comma-separated read-only paths
        required: true
        default: /health
        type: string
      concurrency:
        description: Parallel workers
        required: true
        default: '10'
        type: string
      duration_seconds:
        description: Duration in seconds
        required: true
        default: '30'
        type: string

jobs:
  load:
    name: Authorized staging load
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: 'apsaratalent / develop'
    concurrency:
      group: staging-load
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Authorize staging target
        env:
          REQUESTED_BASE_URL: ${{ inputs.base_url }}
          AUTHORIZED_BASE_URL: ${{ vars.STAGING_API_URL }}
        run: |
          if [ -z "$AUTHORIZED_BASE_URL" ]; then
            echo "STAGING_API_URL repository variable is required" >&2
            exit 1
          fi
          if [ "${REQUESTED_BASE_URL%/}" != "${AUTHORIZED_BASE_URL%/}" ]; then
            echo "The requested URL is not the authorized staging origin" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run thresholded load test
        run: npm run test:load | tee staging-load-result.json
        env:
          LOAD_ALLOW_REMOTE: '1'
          LOAD_BASE_URL: ${{ inputs.base_url }}
          LOAD_PATHS: ${{ inputs.paths }}
          LOAD_CONCURRENCY: ${{ inputs.concurrency }}
          LOAD_DURATION_SECONDS: ${{ inputs.duration_seconds }}
          LOAD_AUTHORIZATION: ${{ secrets['LOAD_TEST_AUTHORIZATION'] }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-load-result
          path: staging-load-result.json
          if-no-files-found: warn
          retention-days: 14
