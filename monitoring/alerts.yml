groups:
  - name: apsaratalent-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"apsaratalent.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service }} is down'
          description: 'Prometheus cannot scrape {{ $labels.service }} ({{ $labels.instance }}) for over 1 minute.'

  - name: apsaratalent-http
    rules:
      # Sustained slow user-facing endpoint.
      - alert: HighHttpP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'High p95 latency on {{ $labels.route }}'
          description: 'p95 latency for {{ $labels.route }} has been above 1s for 10 minutes (current: {{ $value | printf "%.2f" }}s).'

      # More than 5% of a route's requests are 5xx.
      - alert: HighHttp5xxRate
        expr: |
          sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m])) by (route)
            /
          sum(rate(http_request_duration_seconds_count[5m])) by (route)
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Elevated 5xx error rate on {{ $labels.route }}'
          description: '{{ $labels.route }} is returning >5% 5xx responses (current: {{ $value | humanizePercentage }}).'

      # 504s specifically — the recommendation-style gateway timeout signature.
      - alert: GatewayTimeouts
        expr: sum(rate(http_request_duration_seconds_count{status_code="504"}[5m])) by (route) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Gateway timeouts (504) on {{ $labels.route }}'
          description: '{{ $labels.route }} is returning 504s — a downstream service is exceeding the RPC timeout.'

  - name: apsaratalent-services
    rules:
      # Slow service-internal handler — pinpoints the bottleneck in a fan-out.
      - alert: HighRpcP95Latency
        expr: histogram_quantile(0.95, sum(rate(rpc_handler_duration_seconds_bucket[5m])) by (le, service, handler)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Slow RPC handler {{ $labels.service }} · {{ $labels.handler }}'
          description: 'p95 for {{ $labels.handler }} in {{ $labels.service }} has been above 1s for 10 minutes (current: {{ $value | printf "%.2f" }}s).'

      # Event loop blocked — CPU-bound work starving the service (e.g. heavy
      # in-process scoring or sync JSON work).
      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds{job=~"apsaratalent.*"} > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Event-loop lag high in {{ $labels.service }}'
          description: '{{ $labels.service }} event-loop p99 lag has been above 100ms for 5 minutes (current: {{ $value | printf "%.3f" }}s).'

  - name: apsaratalent-resources
    rules:
      # CPU in cores (heuristic — adjust to your per-container CPU allocation).
      - alert: HighCpuUsage
        expr: rate(process_cpu_seconds_total{job=~"apsaratalent.*"}[5m]) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'High CPU in {{ $labels.service }}'
          description: '{{ $labels.service }} has used >0.85 CPU cores for 10 minutes (current: {{ $value | printf "%.2f" }} cores).'

      # Heap pressure — used heap near the total V8 has grown to (GC thrash / OOM risk).
      - alert: HighHeapUsage
        expr: |
          nodejs_heap_size_used_bytes{job=~"apsaratalent.*"}
            /
          nodejs_heap_size_total_bytes{job=~"apsaratalent.*"}
            > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Heap usage high in {{ $labels.service }}'
          description: '{{ $labels.service }} used/total heap has been above 90% for 10 minutes (current: {{ $value | humanizePercentage }}).'

      # Requests are queueing for a DB connection — the pool is the bottleneck.
      - alert: DbPoolSaturated
        expr: db_pool_connections_waiting{job=~"apsaratalent.*"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'DB pool saturated in {{ $labels.service }}'
          description: '{{ $labels.service }} has had requests waiting for a pg connection for 5 minutes (waiting: {{ $value }}). Increase pool max or reduce per-request query count.'

      # Pool running near its configured max — saturation is imminent.
      - alert: DbPoolNearLimit
        expr: |
          db_pool_connections_total{job=~"apsaratalent.*"}
            /
          db_pool_max{job=~"apsaratalent.*"}
            > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'DB pool near limit in {{ $labels.service }}'
          description: '{{ $labels.service }} is using >90% of its pg pool for 10 minutes (current: {{ $value | humanizePercentage }}).'
