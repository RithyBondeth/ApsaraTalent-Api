# Monitoring stack for the ApsaraTalent API.
#   docker compose -f monitoring/docker-compose.yml up -d
#
# Prometheus UI:  http://localhost:9090
# Grafana UI:     http://localhost:3030  (credentials are required via env)
#
# Grafana is on host port 3030 and Prometheus on 9090 to avoid the API's
# host ports (gateway 3000, services 3001-3007, metrics 9101-9107).
services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: apsaratalent-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    # Lets the container reach services running on the host (needed on Linux;
    # already implicit on Docker Desktop for macOS/Windows).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - alertmanager
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 15s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: apsaratalent-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9093/-/ready']
      interval: 15s
      timeout: 5s
      retries: 5

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: apsaratalent-blackbox-exporter
    command: ['--config.file=/etc/blackbox/blackbox.yml']
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9115/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.1.1
    container_name: apsaratalent-grafana
    ports:
      - '127.0.0.1:3030:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
