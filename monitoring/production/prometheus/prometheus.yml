global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager.railway.internal:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
        labels: { service: prometheus }

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager.railway.internal:9093']
        labels: { service: alertmanager }

  - job_name: blackbox-exporter
    static_configs:
      - targets: ['blackbox-exporter.railway.internal:9115']
        labels: { service: blackbox-exporter }

  # The gateway's private hostname is apsaratalent-api, NOT api-gateway. Railway
  # sets each service's RAILWAY_PRIVATE_DOMAIN independently of its display
  # name, and this one does not match. Scraping api-gateway.railway.internal
  # returns "no such host" — verify with:
  #   railway variables --service "API Gateway" --json | grep PRIVATE_DOMAIN
  - job_name: apsaratalent-gateway
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/apsara-metrics-token
    static_configs:
      - targets: ['apsaratalent-api.railway.internal:3000']
        labels: { service: api-gateway }

  # Port 8080, not 9101-9107. Railway injects PORT=8080 into every service, and
  # main.ts resolves its HTTP port as `Number(process.env.PORT) || metricsPort`
  # — so the platform's value always wins over the image's ENV PORT. The
  # 9101-9107 scheme still applies to LOCAL development (see
  # monitoring/prometheus.yml), where all six processes share one host and do
  # need distinct ports. In production each service is its own container with
  # its own IP, so they can all use the same port.
  #
  # Scraping 9101-9107 here produced "connection refused" on all six targets,
  # which meant no application metric ever reached Prometheus and no
  # application-level alert in alerts.yml could ever fire.
  - job_name: apsaratalent-services
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/apsara-metrics-token
    static_configs:
      - targets: ['auth-service.railway.internal:8080']
        labels: { service: auth-service }
      - targets: ['user-service.railway.internal:8080']
        labels: { service: user-service }
      - targets: ['resume-builder-service.railway.internal:8080']
        labels: { service: resume-builder-service }
      - targets: ['chat-service.railway.internal:8080']
        labels: { service: chat-service }
      - targets: ['job-service.railway.internal:8080']
        labels: { service: job-service }
      - targets: ['notification-service.railway.internal:8080']
        labels: { service: notification-service }

  - job_name: apsaratalent-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://apsaratalent-api.railway.internal:3000/health/ready']
        labels: { service: api-gateway-private-readiness }
      - targets: ['__PUBLIC_API_HEALTH_URL__']
        labels: { service: api-gateway-public-readiness }
      - targets: ['__WEB_HEALTH_URL__']
        labels: { service: web-readiness }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.railway.internal:9115
