route:
  receiver: operations
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: operations
      repeat_interval: 1h

receivers:
  - name: operations
    slack_configs:
      - api_url_file: /tmp/apsara-slack-webhook
        channel: '#apsara-operations'
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers: [severity = "critical", alertname = "ServiceDown"]
    target_matchers: [severity = "warning"]
    equal: ['service']
