route:
  receiver: operations
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: operations
      repeat_interval: 1h

receivers:
  - name: operations
    telegram_configs:
      - bot_token_file: /tmp/apsara-telegram-bot-token
        chat_id_file: /tmp/apsara-telegram-chat-id
        send_resolved: true
        parse_mode: ''
        message: >-
          {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers: [severity = "critical", alertname = "ServiceDown"]
    target_matchers: [severity = "warning"]
    equal: ['service']
