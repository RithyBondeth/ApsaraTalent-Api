# Alertmanager routing. By default alerts just collect here and are visible in
# the Alertmanager UI (http://localhost:9093). To actually get notified, fill in
# a receiver below (Slack shown) and point the route at it.
route:
  receiver: default
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # --- Slack example: uncomment and set api_url to your incoming webhook ---
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
    #     channel: '#alerts'
    #     send_resolved: true
    #     title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
    #     text: >-
    #       {{ range .Alerts }}*{{ .Annotations.summary }}*
    #       {{ .Annotations.description }}
    #       {{ end }}

inhibit_rules:
  # A down service shouldn't also page for its latency/error alerts.
  - source_matchers: [severity = "critical", alertname = "ServiceDown"]
    target_matchers: [severity = "warning"]
    equal: ['service']
